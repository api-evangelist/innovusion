  authorization_endpoint: https://seyond.com/oauth/authorize
  token_endpoint: https://seyond.com/oauth/token
  revocation_endpoint: https://seyond.com/oauth/revoke
  grant_types: [authorization_code, refresh_token]
  pkce: S256
  dynamic_client_registration: client_id_metadata_document
  scopes: [mcp]
tools:
  status: gated
  count: null
  note: >-
    tools/list and initialize both return HTTP 401. The tool set and per-tool inputSchema require an
    authenticated OAuth introspection, which this pipeline does not perform. No tool list is asserted
    here. /wp-json/wp-abilities/v1/abilities — the REST projection of the same ability registry — also
    returns 401 (rest_forbidden), so the ability names are not anonymously readable either.
