deployment:
  mode: remote
  endpoint: https://seyond.com/wp-json/mcp/mcp-oauth-server
  auth: oauth
  verified: probed
note: >-
  Seyond serves a live, OAuth-gated Model Context Protocol endpoint from its own corporate host. It is
  provided by the WordPress MCP adapter running on seyond.com (the `mcp` and `wp-abilities/v1` namespaces
  are both registered in the site's WP REST index), so the abilities it exposes are site/content
  abilities — not LiDAR sensor control and not SIMPL traffic data. It is recorded here because it is a
  real agent surface an MCP client can reach at Seyond's own domain, not because Seyond markets an
  agent product. Seyond does not document this endpoint anywhere on seyond.com.
endpoints:
- url: https://seyond.com/wp-json/mcp/mcp-oauth-server
  methods: [POST, GET, DELETE]
  transport: streamable-http
  auth: oauth
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    status: 401
    body_returned: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    www_authenticate: >-
      Bearer realm="https://seyond.com",
      resource_metadata="https://seyond.com/.well-known/oauth-protected-resource"
- url: https://seyond.com/wp-json/mcp/mcp-adapter-default-server
  methods: [POST, GET, DELETE]
  transport: streamable-http
  auth: wordpress-session
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    status: 401
    body_returned: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
