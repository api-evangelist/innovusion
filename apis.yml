apis:
- name: Seyond MCP Server
  description: 'A live, OAuth-gated Model Context Protocol endpoint served from Seyond''s own corporate
    host at https://seyond.com/wp-json/mcp/mcp-oauth-server. It is provided by the WordPress MCP adapter
    running on seyond.com and exposes site/content abilities rather than LiDAR or SIMPL functionality.
    Discovery metadata is anonymous (RFC 8414 authorization-server metadata and RFC 9728 protected-resource
    metadata both return 200); tools/list and initialize both return HTTP 401 mcp_unauthorized, so the
    tool set and its input schemas require an authenticated introspection we did not perform.'
  humanURL: https://seyond.com/
  baseURL: https://seyond.com/wp-json/mcp/mcp-oauth-server
