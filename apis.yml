aid: innovusion
name: Seyond
description: 'Seyond (formerly Innovusion) is a Sunnyvale, California LiDAR maker with R&D and business
  operations in Germany and China. It designs and mass-produces image-grade LiDAR sensors — Falcon K,
  Robin W, Robin E1X and Hummingbird D1 — plus perception software and SIMPL, the Seyond ITS Management
  Platform used by cities, DOTs and tolling agencies for intersection and highway traffic detection. Its
  public developer surface is not a web API: it is a first-party C/C++ client SDK (inno-lidar-sdk) and a
  ROS/ROS2 driver published on GitHub that speak a proprietary TCP/UDP command-and-pointcloud protocol
  directly to the sensor. No OpenAPI, GraphQL, gRPC or SOAP contract is published; api.seyond.com is live
  but answers 404 on every discovery path. The corporate site does serve a live, OAuth-gated MCP server.'
