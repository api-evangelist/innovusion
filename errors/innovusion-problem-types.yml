- code: mcp_unauthorized
  status: 401
  title: MCP authentication required.
  surface: https://seyond.com/wp-json/mcp/mcp-oauth-server
  remediation: >-
    Complete the OAuth authorization-code + PKCE (S256) flow against https://seyond.com/oauth/authorize
    and https://seyond.com/oauth/token for the `mcp` scope, then retry with a bearer token in the
    Authorization header. The response carries a WWW-Authenticate header pointing at
    /.well-known/oauth-protected-resource (RFC 9728).
  observed: '2026-08-23'
- code: rest_forbidden
