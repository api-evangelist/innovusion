- code: null
  status: 404
  title: 404 Not Found (nginx)
  surface: https://api.seyond.com/*
  content_type: text/html
  remediation: >-
    The SIMPL API host is live behind nginx 1.25.3 on an AWS ALB but publishes no anonymous routes. Every
